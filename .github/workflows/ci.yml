name: AI.SDLC change gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-sdlc-change-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run behavioral test suite
        run: npm test
      - name: Note retired process gates
        run: echo "Process gates retired on 2026-11-14 at Carl Weiss's request. This job runs the test suite only. Stale LEQ and JouleWork scores, the skill lock, approval records, and completion paperwork do not block the merge."
