name: AI.SDLC drift gate

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Recompute human board and portfolio metrics
        run: npm run portfolio:sync
      - name: Reject stale generated board or metrics
        run: git diff --exit-code -- ops/portfolio-dashboard.html ops/portfolio-metrics.json
      - name: Fail on stale plans, projects, or measured metrics
        run: npm run plan:drift
