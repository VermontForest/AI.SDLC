name: AI.SDLC release gate

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project id in portfolio.ledger.json
        required: true
        type: string
      release:
        description: Release id in portfolio.ledger.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run behavioral test suite
        run: npm test
      - name: Enforce release evidence, approval, artifact, and rollback gates
        run: node src/cli.mjs plan:validate --ledger portfolio.ledger.json --stage release --project "${{ inputs.project }}" --release "${{ inputs.release }}"
